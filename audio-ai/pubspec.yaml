name: audio_ai
description: "Kernel on-device acoustic scan engine (AudioRecord, quality gate, log-mel, LiteRT). No network code."
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  kernel_contracts:
    path: ../contracts
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kernel.audio_ai
        pluginClass: AudioAiPlugin
