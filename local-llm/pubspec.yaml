name: local_llm
description: "Kernel on-device LiteRT-LM: opt-in grain advice (text only), EmbeddingGemma embeddings and the Pest ID analyzer."
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  kernel_contracts:
    path: ../contracts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kernel.local_llm
        pluginClass: LocalLlmPlugin
