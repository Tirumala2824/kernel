# Kernel sensor signature pack (docs/sensor-protocol.md, section 9).
#
# EXPERIMENTAL. Every rule below is derived from published bioacoustics
# literature and has NOT been validated on Kernel hardware or on labelled
# field recordings. A match is a signal worth a physical inspection, never a
# diagnosis, and "no match" never means "nothing there" (guardrails section 10).
#
# The parser rejects unknown keys, a missing or non-true pack.experimental,
# and any signature listed in pack.signatures without a complete rule.
# Sources need expert review. Frequencies are in Hz, durations in ms, rates in Hz (pulses or bursts per s).

pack.id=kernel-sensor-signatures
pack.version=0.1.0
pack.protocol=1
pack.experimental=true
pack.signatures=mouse_usv,rat_22k,rat_50k,grain_larva,termite_drum,mosquito_wingbeat,cricket_chirp

# House mouse ultrasonic vocalisations: 30-110 kHz, 5-200 ms, FM allowed.
sig.mouse_usv.classes=fmSweep,tonal,flatTone
sig.mouse_usv.sensors=usAir
sig.mouse_usv.minHz=30000
sig.mouse_usv.maxHz=110000
sig.mouse_usv.minDurMs=5
sig.mouse_usv.maxDurMs=200
sig.mouse_usv.source=Holy and Guo 2005 (PLoS Biol 3:e386); Portfors 2007 (JAALAS 46:28)

# Rat 22 kHz calls: 18-32 kHz, at least 300 ms, near-constant frequency.
sig.rat_22k.classes=flatTone,tonal
sig.rat_22k.sensors=usAir
sig.rat_22k.minHz=18000
sig.rat_22k.maxHz=32000
sig.rat_22k.minDurMs=300
sig.rat_22k.maxDurMs=4000
sig.rat_22k.maxBwHz=4000
sig.rat_22k.source=Brudzynski 2013 (Curr Opin Neurobiol 23:310); Portfors 2007

# Rat 50 kHz calls: 35-80 kHz, 10-150 ms, flat or frequency-modulated.
sig.rat_50k.classes=fmSweep,tonal
sig.rat_50k.sensors=usAir
sig.rat_50k.minHz=35000
sig.rat_50k.maxHz=80000
sig.rat_50k.minDurMs=10
sig.rat_50k.maxDurMs=150
sig.rat_50k.source=Brudzynski 2013; Portfors 2007

# Stored-grain insect larvae feeding inside kernels: impulses of 1-10 ms at
# 0.2-10 kHz, grouped in bursts of at least 3 impulses with gaps under 200 ms.
# About 0.02 bursts per second sustained over the window is "possible".
sig.grain_larva.classes=impulseBurst
sig.grain_larva.sensors=contactPiezo,contactAccel
sig.grain_larva.minHz=200
sig.grain_larva.maxHz=10000
sig.grain_larva.minImpulses=3
sig.grain_larva.regular=any
sig.grain_larva.possibleRatePerS=0.02
sig.grain_larva.minWindowS=300
sig.grain_larva.source=Mankin et al. 2011 (Am Entomol 57:30); Njoroge et al. 2016 (J Stored Prod Res 69:31)

# Subterranean termite alarm drumming: regular trains of at least 3 pulses
# at 10-26 pulses per second.
sig.termite_drum.classes=impulseBurst
sig.termite_drum.sensors=contactPiezo,contactAccel
sig.termite_drum.minHz=200
sig.termite_drum.maxHz=10000
sig.termite_drum.minImpulses=3
sig.termite_drum.minRepHz=10
sig.termite_drum.maxRepHz=26
sig.termite_drum.regular=required
sig.termite_drum.source=Roehrig et al. 1999 (Insectes Soc 46:71); Hager and Kirchner 2013 (J Exp Biol 216:3249)

# Mosquito flight tone: 200-700 Hz fundamental with harmonics.
sig.mosquito_wingbeat.classes=harmonic
sig.mosquito_wingbeat.sensors=audioAir
sig.mosquito_wingbeat.minHz=200
sig.mosquito_wingbeat.maxHz=700
sig.mosquito_wingbeat.minDurMs=100
sig.mosquito_wingbeat.minHarmonics=1
sig.mosquito_wingbeat.source=Cator et al. 2009 (Science 323:1077); Mukundarajan et al. 2017 (eLife 6:e27854)

# Field and house crickets: 3.5-5.5 kHz pulsed chirps.
sig.cricket_chirp.classes=pulsedChirp
sig.cricket_chirp.sensors=audioAir
sig.cricket_chirp.minHz=3500
sig.cricket_chirp.maxHz=5500
sig.cricket_chirp.minImpulses=3
sig.cricket_chirp.minRepHz=10
sig.cricket_chirp.maxRepHz=100
sig.cricket_chirp.source=Bennet-Clark 1989 (in Huber et al., Cricket Behavior and Neurobiology)
